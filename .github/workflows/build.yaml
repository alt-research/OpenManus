name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*" # Only trigger for tags that start with "v" (you can adjust the pattern as needed)

env:
  ECR_REPO: 305587085711.dkr.ecr.us-west-2.amazonaws.com/open-manus

jobs:
  build_image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Amazon ECR
        uses: docker/login-action@v3
        with:
          registry: 305587085711.dkr.ecr.us-west-2.amazonaws.com
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          use: true

      - name: Prepare environment variables
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          GIT_TAG=$(git tag --points-at HEAD)
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
          echo "REF_NAME=$(echo ${GIT_TAG:-$GITHUB_REF_NAME} | sed 's/[^a-zA-Z0-9._]/-/g')" >> $GITHUB_ENV
          echo "GIT_BRANCH=$(git branch --show-current)" >> $GITHUB_ENV
          echo "BRANCH=${GIT_BRANCH:-'main'}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.ECR_REPO }}
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=
            type=raw,value=${{ env.GIT_TAG }}
            type=raw,value=latest,enable=${{ env.GIT_BRANCH == 'main' }}
            type=raw,value=${{ env.GIT_BRANCH }}-latest,enable=${{ env.GIT_BRANCH != 'main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SHORT_SHA=${{ env.SHORT_SHA }}
